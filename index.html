<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Getulio | Zero-Knowledge Ledger</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,200,0,0" />

    <style>
        :root {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-muted: #666666;
            --accent: #d90000; /* O vermelho clássico que usamos antes */
            --green: #4ade80;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Ruído de fundo sutil para dar textura */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 800px;
            padding: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--text-muted);
            margin-bottom: 3rem;
        }

        .logo span {
            color: var(--text-main);
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
            font-family: 'JetBrains Mono', monospace; /* Fonte mono para o efeito de cifra */
        }

        p.subtitle {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-muted);
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 3rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--green);
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        footer {
            position: absolute;
            bottom: 2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <span class="material-symbols-outlined" style="font-size: 28px;">deployed_code</span>
            GETULIO<span>.APP</span>
        </div>

        <h1 id="cipher-text" data-value="ZERO-KNOWLEDGE">X7A9-K8L2P0QW</h1>
        
        <p class="subtitle">
            O seu ledger blindado. Privacidade absoluta por design.<br>
            Nem nós, nem ninguém, além de você, tem as chaves.
        </p>

        <div class="status-badge">
            <div class="pulse"></div>
            SISTEMA EM COMPILAÇÃO...
        </div>
    </div>

    <footer>
        &copy; 2026 GETULIO. TODOS OS DIREITOS RESERVADOS.
    </footer>

    <script>
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
        const element = document.getElementById("cipher-text");
        
        let iteration = 0;
        let interval = null;

        // Inicia o efeito 500ms após a página carregar
        setTimeout(() => {
            clearInterval(interval);
            
            interval = setInterval(() => {
                element.innerText = element.innerText
                .split("")
                .map((letter, index) => {
                    if(index < iteration) {
                        return element.dataset.value[index];
                    }
                    return letters[Math.floor(Math.random() * 42)];
                })
                .join("");
                
                if(iteration >= element.dataset.value.length){ 
                    clearInterval(interval);
                }
                
                iteration += 1 / 3; // Controla a velocidade do efeito
            }, 30);
        }, 500);
    </script>
</body>
</html>
